# The organization's image server: ComfyUI, in the tgpu cluster (services/k3d/tgpu.mjs).
#   comfyui   web interface and API (/prompt, /history, /view, /ws), published on http://comfyui.localhost:8090
# The tterm recording cluster reaches it through the relay in k8s-relais.yaml (http://comfyui.localhost:8080
# for the browser, http://comfyui.comfyui.svc.cluster.local:8188 for Open WebUI).
# Graphics card (8 GB) shared with the audio studio: nvidia runtime, NVIDIA_VISIBLE_DEVICES, no
# device plugin. ComfyUI manages its video memory dynamically (comfy-aimdo) and keeps
# --vram-headroom GB free, taking the other programs into account (audio studio, OBS).
# Volume: /modeles/comfyui (Docker volume tgpu-modeles, mounted in the node by tgpu.mjs) =
# ComfyUI's --base-directory: models/ (comfyui-modeles Job), input/, output/, user/ (settings and
# interface workflows), temp/.
apiVersion: v1
kind: Namespace
metadata:
  name: comfyui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: comfyui
spec:
  replicas: 1
  strategy: { type: Recreate }         # a single card: the old pod frees its memory before the new one starts
  selector:
    matchLabels: { app: comfyui }
  template:
    metadata:
      labels: { app: comfyui }
    spec:
      runtimeClassName: nvidia
      containers:
        - name: comfyui
          image: comfyui:1
          imagePullPolicy: IfNotPresent   # image loaded with "k3d image import", no registry
          command:
            - python
            - main.py
            - --listen=0.0.0.0
            - --port=8188
            - --base-directory=/modeles/comfyui
            - --vram-headroom=1.5          # GB kept free for the audio studio and OBS
            - --preview-method=latent2rgb  # preview while computing, in the filmed interface
          ports: [{ containerPort: 8188 }]
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
            - { name: HOME, value: /modeles/comfyui/user }
          readinessProbe:
            httpGet: { path: /system_stats, port: 8188 }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /system_stats, port: 8188 }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: "1", memory: 4Gi }
          volumeMounts:
            - { name: modeles, mountPath: /modeles }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: modeles
          hostPath: { path: /modeles, type: DirectoryOrCreate }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui
  namespace: comfyui
spec:
  selector: { app: comfyui }
  ports: [{ port: 8188, targetPort: 8188 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comfyui
  namespace: comfyui
spec:
  ingressClassName: traefik
  rules:
    - host: comfyui.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: comfyui, port: { number: 8188 } } }
